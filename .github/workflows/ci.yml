name: PHP checks

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local services
        run: cp .env.example .env
      - name: Start services
        run: docker compose up --build -d
      - name: Check PHP syntax
        run: find app public scripts -name '*.php' -print0 | xargs -0 -n1 docker compose exec -T web php -l
      - name: Check public pages
        run: |
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/login > /dev/null
      - name: Check portal workflows
        run: |
          python3 tests/smoke.py
          python3 tests/new-features.py
          python3 tests/settings-workflows.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop services
        if: always()
        run: docker compose down -v

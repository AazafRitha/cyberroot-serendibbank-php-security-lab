services:
  web:
    build: .
    command: ["sh", "-c", "mkdir -p var/identity && chown www-data:www-data var/identity && php scripts/migrate.php && exec apache2-foreground"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Copy .env.example to .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_HTTPS: ${APP_HTTPS:-0}
      MANAGEMENT_HOST: ${MANAGEMENT_HOST:-manage.localhost}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-outbox}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SerendibBank}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./app:/var/www/html/app
      - ./public:/var/www/html/public
      - ./scripts:/var/www/html/scripts
      - ./database:/var/www/html/database
      - otp_outbox:/var/www/html/var/otp
      - identity_keys:/var/www/html/var/identity
      - support_uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - database

  mailpit:
    image: axllent/mailpit:v1.30.0
    profiles: [mailtest]
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - frontend

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Copy .env.example to .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - database

volumes:
  db_data:
  otp_outbox:
  identity_keys:
  support_uploads:

networks:
  frontend: {}
  database:
    internal: true
